<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cube Dodger</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
        }
        #game-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: 'Press Start 2P', cursive;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4444;
            font-family: 'Press Start 2P', cursive;
            font-size: 48px;
            text-align: center;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
            display: none;
            flex-direction: column;
        }
        #game-over small {
            font-size: 20px;
            margin-top: 20px;
            color: white;
        }
    </style>
</head>
<body>
    <!-- The 3D game will be rendered here -->
    <canvas id="game-canvas"></canvas>

    <!-- Game UI Elements -->
    <div id="ui-container">
        <div id="score">Score: 0</div>
    </div>
    <div id="game-over">
        GAME OVER
        <small>Press 'R' to Restart</small>
    </div>

    <!-- Load the three.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, player, obstacles, score, isGameOver;
        const obstacleSpeed = 0.20;
        const playerSpeed = 0.30;
        const spawnInterval = 1000; // in ms
        const gameLaneWidth = 10;
        
        function init() {
            // Reset game state
            obstacles = [];
            score = 0;
            isGameOver = false;

            // Show score, hide game over
            document.getElementById('score').textContent = 'Score: 0';
            document.getElementById('game-over').style.display = 'none';

            // --- Basic Setup ---
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a202c);
            scene.fog = new THREE.Fog(0x1a202c, 10, 40);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 6);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('game-canvas'),
                antialias: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            // --- Lighting ---
            const ambientLight = new THREE.AmbientLight(0x666666);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7.5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // --- Ground Plane ---
            const groundGeo = new THREE.PlaneGeometry(20, 50);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x4a5568 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.5;
            ground.receiveShadow = true;
            scene.add(ground);

            // --- Player ---
            const playerGeo = new THREE.BoxGeometry(1, 1, 1);
            const playerMat = new THREE.MeshStandardMaterial({ color: 0x3182ce });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.y = 0.5;
            player.castShadow = true;
            scene.add(player);

            // --- Event Listeners ---
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);

            // --- Start Game ---
            if (window.obstacleSpawner) clearInterval(window.obstacleSpawner);
            window.obstacleSpawner = setInterval(spawnObstacle, spawnInterval);
            
            animate();
        }

        function spawnObstacle() {
            if (isGameOver) return;
            
            const obstacleGeo = new THREE.BoxGeometry(1, 1, 1);
            const obstacleMat = new THREE.MeshStandardMaterial({ color: 0xe53e3e });
            const obstacle = new THREE.Mesh(obstacleGeo, obstacleMat);
            
            obstacle.position.set(
                (Math.random() - 0.5) * gameLaneWidth,
                0.5,
                -30
            );
            obstacle.castShadow = true;
            
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        function onKeyDown(event) {
            if (isGameOver) {
                if (event.code === 'KeyR') {
                    init();
                }
                return;
            }

            switch(event.code) {
                case 'ArrowLeft':
                case 'KeyA':
                    player.position.x = Math.max(player.position.x - playerSpeed, -gameLaneWidth / 2);
                    break;
                case 'ArrowRight':
                case 'KeyD':
                    player.position.x = Math.min(player.position.x + playerSpeed, gameLaneWidth / 2);
                    break;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function checkCollision(obstacle) {
            // Simple Axis-Aligned Bounding Box (AABB) collision
            const playerBox = new THREE.Box3().setFromObject(player);
            const obstacleBox = new THREE.Box3().setFromObject(obstacle);
            return playerBox.intersectsBox(obstacleBox);
        }

        function animate() {
            if (isGameOver) return;
            
            requestAnimationFrame(animate);

            // Update score
            score += 1;
            document.getElementById('score').textContent = `Score: ${score}`;

            // Animate obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obstacle = obstacles[i];
                obstacle.position.z += obstacleSpeed;

                // Check for collision
                if (checkCollision(obstacle)) {
                    isGameOver = true;
                    document.getElementById('game-over').style.display = 'flex';
                    clearInterval(window.obstacleSpawner);
                }

                // Remove obstacles that have passed
                if (obstacle.position.z > camera.position.z) {
                    scene.remove(obstacle);
                    obstacles.splice(i, 1);
                }
            }
            
            // Camera follows player smoothly
            camera.position.x += (player.position.x - camera.position.x) * 0.1;
            camera.lookAt(player.position.x, 0, 0);

            renderer.render(scene, camera);
        }

        // Start the game when the window loads
        window.onload = init;
    </script>
</body>
</html>
