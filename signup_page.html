<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelPlay Arcade - Create Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c;
            color: #e2e8f0;
            overflow: hidden; /* Hide scrollbars caused by animations */
        }
        .font-game {
            font-family: 'Press Start 2P', cursive;
        }
        .form-container {
            animation: fadeIn 1s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .input-field {
            background-color: #2d3748;
            border: 2px solid #4a5568;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            outline: none;
            border-color: #9f7aea;
            box-shadow: 0 0 15px rgba(159, 122, 234, 0.5);
        }
        .cta-button {
            background: linear-gradient(135deg, #4299e1 0%, #9f7aea 100%);
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1), 0 0 0 3px rgba(159, 122, 234, 0.3);
            position: relative;
            overflow: hidden;
        }
        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.1), 0 0 0 4px rgba(159, 122, 234, 0.5);
        }
        /* Background Animation: Floating Particles */
        .particle {
            position: absolute;
            background: #e2e8f0;
            border-radius: 50%;
            opacity: 0.2;
            animation: rise 10s infinite ease-in;
        }
        @keyframes rise {
            0% { transform: translateY(0); }
            100% { transform: translateY(-1080px); }
        }
    </style>
</head>
<body class="antialiased">

    <div id="particle-container" class="absolute top-0 left-0 w-full h-full z-0"></div>

    <div class="min-h-screen flex items-center justify-center relative z-10 px-4">
        <div class="max-w-md w-full p-8 md:p-10 bg-gray-900/80 backdrop-blur-lg rounded-2xl shadow-2xl shadow-purple-900/30 border border-gray-700 form-container">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-game text-white">Join PixelPlay</h1>
                <p class="text-gray-400 mt-2">Create your player account to begin.</p>
            </div>

            <form id="signup-form">
                <div class="space-y-6">
                    <div>
                        <label for="username" class="text-sm font-bold text-gray-300 block mb-2">Username</label>
                        <input type="text" id="username" name="username" class="w-full p-3 rounded-lg text-white input-field" placeholder="PlayerOne">
                    </div>
                    <div>
                        <label for="email" class="text-sm font-bold text-gray-300 block mb-2">Email</label>
                        <input type="email" id="email" name="email" class="w-full p-3 rounded-lg text-white input-field" placeholder="player@example.com">
                    </div>
                    <div>
                        <label for="password" class="text-sm font-bold text-gray-300 block mb-2">Password</label>
                        <input type="password" id="password" name="password" class="w-full p-3 rounded-lg text-white input-field" placeholder="••••••••">
                    </div>
                </div>

                <div class="mt-10">
                    <button type="submit" class="w-full text-white font-bold py-4 px-4 rounded-lg cta-button text-lg">
                        Create Account
                    </button>
                </div>
            </form>
            
            <div class="text-center mt-6">
                <a href="./game_landing_page.html" class="text-sm text-purple-400 hover:text-purple-300 transition-colors">&larr; Back to Arcade</a>
            </div>
        </div>
    </div>
    
    <script>
        // Particle animation script
        const particleContainer = document.getElementById('particle-container');
        const particles = 25;
        for (let i = 0; i < particles; i++) {
            let particle = document.createElement('div');
            particle.classList.add('particle');
            
            let x = Math.floor(Math.random() * 100);
            let y = Math.floor(Math.random() * 100);
            let size = Math.random() * 8;
            let duration = Math.random() * 5 + 5; // 5 to 10 seconds
            let delay = Math.random() * 5;

            particle.style.left = x + 'vw';
            particle.style.bottom = '-' + size + 'px'; // Start from bottom
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.animationDuration = duration + 's';
            particle.style.animationDelay = delay + 's';
            
            particleContainer.appendChild(particle);
        }

        // Form submission script
        const signupForm = document.getElementById('signup-form');
        signupForm.addEventListener('submit', function(event) {
            event.preventDefault(); // Stop the form from submitting the traditional way
            
            // Get the username from the input
            const usernameInput = document.getElementById('username');
            const username = usernameInput.value || 'Player'; // Default to 'Player' if empty

            // Store the username in the browser's local storage to use on the next page
            localStorage.setItem('pixelPlayUsername', username);
            
            // Redirect to the game dashboard
            window.location.href = './index.html';
        });
    </script>
</body>
</html>
