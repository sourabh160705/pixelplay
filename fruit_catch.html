<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit cuting - PixelPlay Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1a202c;
            overflow: hidden;
        }
        .font-game {
            font-family: 'Press Start 2P', cursive;
        }
        #gameArea {
            background-color: #2d3748;
            border: 4px solid #4a5568;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05), inset 0 0 20px rgba(0,0,0,0.3);
            position: relative;
            cursor: crosshair;
            overflow: hidden;
        }
        .fruit {
            position: absolute;
            font-size: 50px;
            user-select: none; /* Prevents text selection on click */
            transition: transform 0.2s ease-out;
        }
        .fruit:hover {
            transform: scale(1.2);
        }
        .modal {
            background-color: rgba(0, 0, 0, 0.8);
        }
        .btn-arcade {
            background-color: #ec4899; /* Pink theme for this game */
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.3s;
            border-bottom: 4px solid #9d2463;
            font-size: 1.25rem;
        }
        .btn-arcade:hover {
            background-color: #f472b6;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="text-center mb-4">
        <h1 class="text-4xl font-game text-pink-400">Fruit cuting</h1>
        <p class="text-gray-400 mt-2">A fast and fun arcade game of catching fruit.</p>
    </div>

    <!-- Game Area -->
    <div id="gameArea" class="w-full max-w-3xl h-[60vh] rounded-lg relative">
        <!-- Fruits will be spawned here -->
    </div>
    
    <!-- HUD -->
    <div class="w-full max-w-3xl mt-4 flex justify-between items-center font-game text-2xl">
        <div>Score: <span id="score">0</span></div>
        <div>Time: <span id="timer">40</span></div>
    </div>
     <a href="./game_dashboard.html" class="mt-6 text-pink-400 hover:text-pink-300 font-bold">Back to Arcade</a>

    <!-- Start/End Game Modal -->
    <div id="modal" class="modal fixed inset-0 flex items-center justify-center">
        <div class="bg-gray-800 p-8 rounded-lg text-center border-4 border-gray-700 shadow-lg">
            <h2 id="modalTitle" class="text-4xl font-game mb-4">Fruit cuting!</h2>
            <p id="modalText" class="text-lg mb-6">Click as many fruits as you can in 40 seconds!</p>
            <p id="finalScore" class="text-3xl font-bold mb-6 hidden"></p>
            <button id="startGameBtn" class="btn-arcade">Start Game</button>
        </div>
    </div>

    <script>
        const gameArea = document.getElementById('gameArea');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalText = document.getElementById('modalText');
        const finalScoreDisplay = document.getElementById('finalScore');
        const startGameBtn = document.getElementById('startGameBtn');

        const fruits = ['🍎', '🍌', '🍉', '🍇', '🍓', '🍒', '🍑', '🍍', '🥝'];
        let score = 0;
        let timeLeft = 30;
        let gameInterval;

        function spawnFruit() {
            const fruit = document.createElement('div');
            fruit.classList.add('fruit');
            fruit.innerText = fruits[Math.floor(Math.random() * fruits.length)];

            const { width, height } = gameArea.getBoundingClientRect();
            const size = 50;
            fruit.style.left = `${Math.random() * (width - size)}px`;
            fruit.style.top = `${Math.random() * (height - size)}px`;

            fruit.addEventListener('click', () => {
                score++;
                scoreDisplay.innerText = score;
                fruit.remove();
            });

            gameArea.appendChild(fruit);

            setTimeout(() => {
                if(fruit) fruit.remove();
            }, 2000); 
        }

        function startGame() {
            score = 0;
            timeLeft = 30;
            scoreDisplay.innerText = score;
            timerDisplay.innerText = timeLeft;
            gameArea.innerHTML = '';
            modal.classList.add('hidden');

            gameInterval = setInterval(() => {
                spawnFruit();
            }, 700); 

            const timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(gameInterval);
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            modal.classList.remove('hidden');
            modalTitle.innerText = "Game Over!";
            modalText.innerText = "You did great! Want to play again?";
            finalScoreDisplay.innerText = `Final Score: ${score}`;
            finalScoreDisplay.classList.remove('hidden');
            startGameBtn.innerText = "Play Again";
        }

        startGameBtn.addEventListener('click', startGame);

    </script>
</body>
</html>
