<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Wizards - PixelPlay Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1a202c;
            overflow: hidden;
        }
        .font-game {
            font-family: 'Press Start 2P', cursive;
        }
        .font-fantasy {
            font-family: 'MedievalSharp', cursive;
        }
        .game-container {
            background: linear-gradient(to bottom, #2d3748, #1a202c);
            border: 4px solid #4a5568;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05), inset 0 0 30px rgba(0,0,0,0.5);
        }
        .monster-display {
            font-size: 10rem;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
        }
        .monster-defeat {
            transform: scale(0);
            opacity: 0;
        }
        .letter-tile {
            background-color: #4a5568;
            border-bottom: 4px solid #2d3748;
            padding: 1rem;
            border-radius: 0.5rem;
            font-size: 2rem;
            margin: 0.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .input-spell {
            background-color: #2d3748;
            border: 2px solid #718096;
            color: white;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 0.2em;
        }
        .btn-magic {
            background-color: #805ad5; /* Purple theme */
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
            border-bottom: 4px solid #553c9a;
            font-size: 1.25rem;
        }
        .btn-magic:hover {
            background-color: #9f7aea;
            transform: translateY(-2px);
        }
        .feedback {
            height: 2rem;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="game-container w-full max-w-2xl p-6 rounded-lg text-center">
        <h1 class="text-4xl font-game text-purple-400">Word Wizards</h1>
        <p class="text-gray-400 mt-2 font-fantasy text-xl">Create words to cast spells and defeat monsters.</p>

        <!-- Monster -->
        <div id="monster" class="monster-display my-8">👹</div>

        <!-- Letters to use -->
        <div id="letters" class="flex justify-center items-center my-4 font-game">
            <!-- Letter tiles will be generated here -->
        </div>

        <!-- Player Input -->
        <div class="my-6">
            <input type="text" id="wordInput" class="input-spell w-full max-w-md uppercase" placeholder="TYPE YOUR SPELL" autocomplete="on">
        </div>
        <button id="castButton" class="btn-magic font-game">Cast Spell</button>
        
        <!-- Feedback Message -->
        <p id="feedback" class="feedback mt-4 text-yellow-400 font-fantasy text-lg"></p>

        <!-- Score -->
        <div class="mt-6 font-game text-2xl">Score: <span id="score">0</span></div>
    </div>
    
    <a href="./game_dashboard.html" class="mt-6 text-purple-400 hover:text-purple-300 font-bold font-fantasy">Back to Arcade</a>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const monsterDisplay = document.getElementById('monster');
            const lettersDisplay = document.getElementById('letters');
            const wordInput = document.getElementById('wordInput');
            const castButton = document.getElementById('castButton');
            const scoreDisplay = document.getElementById('score');
            const feedbackDisplay = document.getElementById('feedback');

            const monsters = ['👹', '👻', '🐲', '👽', '🤖', '💀', '🎃', '👺'];
            const wordList = ["MAGIC", "POWER", "SPELL", "WIZARD", "GHOST", "DRAGON", "SWORD", "SHIELD", "CASTLE", "KNIGHT", "FIRE", "WATER", "EARTH", "AIR", "LIGHT", "DARK"];
            let currentWord = "";
            let score = 0;

            function shuffle(array) {
                let currentIndex = array.length, randomIndex;
                while (currentIndex != 0) {
                    randomIndex = Math.floor(Math.random() * currentIndex);
                    currentIndex--;
                    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
                }
                return array;
            }

            function newRound() {
                // Reset input and feedback
                wordInput.value = "";
                wordInput.focus();
                feedbackDisplay.textContent = "";

                // Get a new word
                currentWord = wordList[Math.floor(Math.random() * wordList.length)];
                let shuffledLetters = shuffle(currentWord.split(''));

                // Display new letters
                lettersDisplay.innerHTML = "";
                shuffledLetters.forEach(letter => {
                    const tile = document.createElement('div');
                    tile.className = 'letter-tile';
                    tile.textContent = letter;
                    lettersDisplay.appendChild(tile);
                });

                // Display new monster
                monsterDisplay.textContent = monsters[Math.floor(Math.random() * monsters.length)];
                monsterDisplay.classList.remove('monster-defeat');
            }

            function checkWord() {
                const playerWord = wordInput.value.toUpperCase();

                if (playerWord === currentWord) {
                    // Correct word
                    score++;
                    scoreDisplay.textContent = score;
                    feedbackDisplay.textContent = "Direct Hit!";
                    feedbackDisplay.style.color = "#48bb78"; // Green
                    
                    // Defeat monster
                    monsterDisplay.classList.add('monster-defeat');

                    // Start next round after a delay
                    setTimeout(newRound, 1000);
                } else {
                    // Incorrect word
                    feedbackDisplay.textContent = "Spell Fizzled! Try again.";
                    feedbackDisplay.style.color = "#f56565"; // Red
                    wordInput.value = "";
                }
            }
            
            if(castButton) {
                castButton.addEventListener('click', checkWord);
            }
            
            if(wordInput) {
                wordInput.addEventListener('keyup', (event) => {
                    if (event.key === "Enter") {
                        checkWord();
                    }
                });
            }

            // Start the first round
            newRound();
        });
    </script>
</body>
</html>
